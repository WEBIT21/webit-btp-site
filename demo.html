<style>
/* Layout: sidebar + work area on desktop; top bar + bottom tabs on phone. Brand color comes from the active company. */
:root{
  --bg:#F4F4F1;--panel:#FFFFFF;--panel-2:#FAFAF8;--sunk:#EEEDE9;--line:#E3E2DD;--line-2:#EDECE8;
  --ink:#16181B;--ink-2:#4A4F57;--muted:#6C717A;
  --ok:#1F7A47;--ok-bg:#E5F2EA;--warn:#8A5300;--warn-bg:#FBF0DB;--bad:#B42318;--bad-bg:#FBEAE7;--info:#2456A6;--info-bg:#E8EFFA;
  --brand:#C2410C;--brand-ink:#FFFFFF;
  --brand-weak:color-mix(in srgb,var(--brand) 11%,var(--panel));
  --brand-text:color-mix(in srgb,var(--brand) 88%,var(--ink));
  --g-google:#2F6FDB;--g-outlook:#1F6FB2;--g-teams:#5B5FC7;
  --f-ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-doc:"Geist",ui-sans-serif,system-ui,sans-serif;
  --r:10px;--r-lg:14px;
  --shadow:0 1px 2px rgba(20,22,26,.04),0 8px 24px rgba(20,22,26,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0F11;--panel:#16181B;--panel-2:#1A1C20;--sunk:#121316;--line:#272A2F;--line-2:#202328;
  --ink:#ECEDEE;--ink-2:#B4B8BE;--muted:#8D9299;
  --ok:#5FCB8E;--ok-bg:#15291D;--warn:#F2C063;--warn-bg:#33270F;--bad:#F28B82;--bad-bg:#3A1714;--info:#8DB4F5;--info-bg:#17233A;
  --brand-weak:color-mix(in srgb,var(--brand) 20%,var(--panel));--brand-text:color-mix(in srgb,var(--brand) 62%,white);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F11;--panel:#16181B;--panel-2:#1A1C20;--sunk:#121316;--line:#272A2F;--line-2:#202328;
  --ink:#ECEDEE;--ink-2:#B4B8BE;--muted:#8D9299;
  --ok:#5FCB8E;--ok-bg:#15291D;--warn:#F2C063;--warn-bg:#33270F;--bad:#F28B82;--bad-bg:#3A1714;--info:#8DB4F5;--info-bg:#17233A;
  --brand-weak:color-mix(in srgb,var(--brand) 20%,var(--panel));--brand-text:color-mix(in srgb,var(--brand) 62%,white);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100%}
/* sidebar */
.side{width:252px;flex-shrink:0;background:var(--panel-2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.tenant{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);width:100%;text-align:left}
.tenant:hover{border-color:var(--ink-2)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.02em;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.tname{font-weight:600;font-size:13.5px;line-height:1.2}
.tsub{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav h4{margin:12px 10px 6px;font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--muted)}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:8px;color:var(--ink-2);font-size:14px;text-align:left}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--brand-weak);color:var(--brand-text);font-weight:600}
.nav svg{width:17px;height:17px;flex-shrink:0}
.nav .cnt{margin-left:auto;font-size:11px;font-family:var(--f-num);color:var(--muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.me{display:flex;align-items:center;gap:10px;padding:8px}
.av{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);flex:0 1 340px;color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.kbd{font-family:var(--f-num);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
.demo{font-size:11.5px;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.sp{flex:1}
.ib{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center}
.ib svg{width:17px;height:17px}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--panel)}
.page{padding:26px 28px 60px;display:flex;flex-direction:column;gap:20px;max-width:1440px;width:100%}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.eyb{font-size:12px;color:var(--muted);letter-spacing:.02em}
h1{margin:2px 0 0;font-size:28px;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.005em}
h3{margin:0;font-size:14px;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.link{border:0;background:none;padding:0;color:var(--ink-2);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.kpi{display:flex;flex-direction:column;gap:8px}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{flex:1 1 320px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.brand{background:var(--brand-weak);color:var(--brand-text)}
.cc{font-family:var(--f-num);font-size:10.5px;padding:2px 6px;border:1px solid var(--line);border-radius:5px;color:var(--ink-2)}
.list>*{border-top:1px solid var(--line-2)}
.li{display:flex;align-items:center;gap:12px;padding:11px 0}
.li .t{font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--ink);transition:width .7s cubic-bezier(.2,.8,.2,1)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:500;color:var(--muted);padding:0 10px 10px;white-space:nowrap}
td{padding:11px 10px;border-top:1px solid var(--line-2);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel-2)}
.tw{overflow-x:auto}
.r{text-align:right}
input.f,select.f,textarea.f{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);outline:0}
textarea.f{height:auto;padding:9px 11px;line-height:1.45;resize:vertical}
.f:focus,.cell:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
label.fl{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.col{background:var(--sunk);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:440px;scroll-snap-align:start;transition:background .15s,outline-color .15s;outline:2px dashed transparent;outline-offset:-2px}
.col.over{outline-color:var(--brand);background:var(--brand-weak)}
.colh{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 2px;font-size:13px;font-weight:600}
.deal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:9px;cursor:grab;transition:transform .15s,box-shadow .15s}
.deal:hover{box-shadow:var(--shadow)}
.deal.drag{opacity:.4}
.deal .amt{font-size:17px;font-weight:600;letter-spacing:-.02em}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,11,13,.38);z-index:50;display:flex;justify-content:flex-end;animation:fade .15s}
.drawer{width:min(520px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:18px;animation:slide .22s cubic-bezier(.2,.8,.2,1)}
.modal{margin:auto;width:min(520px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;animation:pop .18s}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(40px);opacity:.4}}@keyframes pop{from{transform:scale(.97);opacity:0}}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:80;max-width:min(400px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--panel);border-radius:12px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start;font-size:13.5px;box-shadow:var(--shadow);animation:pop .2s}
.toast i{width:8px;height:8px;border-radius:50%;background:#5FCB8E;margin-top:6px;flex-shrink:0}
.toast button{margin-left:auto;border:0;background:none;color:inherit;text-decoration:underline;font-size:12.5px;white-space:nowrap}
/* devis editor */
.dv{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.dv-main{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:14px}
.dv-side{flex:1 1 300px;max-width:380px;min-width:0;display:flex;flex-direction:column;gap:14px;position:sticky;top:78px}
.lot{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.loth{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--panel-2);border-bottom:1px solid var(--line-2)}
.lt td{padding:6px 6px}
.lt th{padding:10px 6px 6px}
.cell{width:100%;height:34px;border:1px solid transparent;border-radius:7px;background:none;padding:0 8px;outline:0}
.cell:hover{border-color:var(--line)}
.cell.n{text-align:right;font-family:var(--f-num);font-size:13px}
.tot{background:var(--ink);color:var(--panel);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.tot .big{font-size:32px;font-weight:600;letter-spacing:-.03em}
.tot .ln{display:flex;justify-content:space-between;font-size:13px;opacity:.85}
.gauge{height:8px;border-radius:4px;background:color-mix(in srgb,var(--panel) 18%,transparent);position:relative}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--brand)}
/* document preview */
.doc{background:#fff;color:#1b1d20;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 12px 32px rgba(0,0,0,.10);padding:44px 46px;font-family:var(--f-doc);font-size:12px;line-height:1.5;max-width:820px;margin:0 auto;width:100%}
.doc .dh{display:flex;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:3px solid var(--brand)}
.doc .dlogo{width:58px;height:58px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;overflow:hidden}
.doc .dlogo img{width:100%;height:100%;object-fit:contain;background:#fff}
.doc h5{margin:0 0 4px;font-size:10px;letter-spacing:.08em;color:#6b6f76;font-weight:600}
.doc table th{color:#6b6f76;font-size:10px;padding:8px 6px;border-bottom:1px solid #d8d8d4;text-transform:uppercase;letter-spacing:.05em}
.doc table td{padding:7px 6px;border-top:1px solid #ecebe7;font-size:11.5px}
.doc .lotrow td{background:color-mix(in srgb,var(--brand) 8%,#fff);font-weight:600;color:#1b1d20}
.doc .ment{font-size:9.5px;color:#55595f;line-height:1.55}
/* gantt */
.gt{display:flex;flex-direction:column;gap:9px;position:relative}
.gr{display:flex;align-items:center;gap:12px}
.gr .gn{width:190px;flex-shrink:0;font-size:13px;color:var(--ink-2)}
.gr .gtrk{flex:1;position:relative;height:22px}
.gb{position:absolute;top:0;height:22px;border-radius:6px;background:var(--sunk);overflow:hidden}
.gb i{display:block;height:100%;background:var(--ink)}
/* calendar */
.cal{display:grid;grid-template-columns:52px repeat(5,minmax(120px,1fr));min-width:700px}
.calh{padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}
.calc{position:relative;border-left:1px solid var(--line-2);height:672px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 55px,var(--line-2) 55px,var(--line-2) 56px)}
.ev{position:absolute;left:5px;right:5px;border-radius:9px;padding:6px 9px;font-size:12px;overflow:hidden;border-left:3px solid}
/* mobile terrain frame */
.phone{width:min(400px,100%);margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph-tile{aspect-ratio:1;border-radius:10px;background:var(--sunk);overflow:hidden;position:relative;display:flex;align-items:flex-end;padding:6px;font-size:10.5px;color:var(--ink-2)}
.ph-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph-tile span{position:relative;background:color-mix(in srgb,var(--panel) 85%,transparent);padding:2px 6px;border-radius:5px}
/* switch */
.sw{width:42px;height:24px;border-radius:12px;background:var(--line);border:0;position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--brand)}.sw[aria-checked="true"]::after{left:21px}
.swatch{width:30px;height:30px;border-radius:8px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
.locked{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:60px 20px}
/* mobile chrome */
.mtop,.mtab{display:none}
@media (max-width:860px){
  .side{display:none}
  .top{display:none}
  .mtop{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .mtab{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .mtab button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:6px 0;min-height:48px}
  .mtab button.on{color:var(--brand-text);font-weight:600}
  .mtab svg{width:21px;height:21px}
  .page{padding:18px 16px 96px;gap:16px}
  h1{font-size:24px}
  .dv-side{position:static;max-width:none}
  .lt .hide-m{display:none}
  .lt td:first-child{min-width:0!important}
  .lt .qcol{width:72px!important}
  .lt td:last-child{width:auto!important;white-space:nowrap}
  .gr .gn{width:110px;font-size:12px}
  .doc{padding:26px 20px}
  .toasts{left:16px;right:16px;bottom:84px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.seg.ent button{display:inline-flex;align-items:center;gap:6px}
.ccd{font-family:var(--f-num);font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;border:1px solid currentColor;opacity:.75;margin-right:6px}
.seg.ent button .ccd{margin-right:0}
@media (max-width:860px){.mtop{flex-wrap:wrap}.mtop .seg.ent{display:flex;width:100%}.mtop .seg.ent button{flex:1;justify-content:center}}

/* carte live */
.live{display:flex;flex-direction:column;gap:14px}
.live-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.live-kpi>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.live-kpi b{font-size:24px;font-weight:650;letter-spacing:-.02em}.live-kpi small{color:var(--muted);font-size:12px}
.live-stage{position:relative;height:min(68vh,640px);min-height:420px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(120% 90% at 50% 30%,var(--panel-2),var(--sunk))}
#livecv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}#livecv:active{cursor:grabbing}
#livetags{position:absolute;inset:0;pointer-events:none}
.ltag{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;white-space:nowrap;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font:600 12px/1 inherit;box-shadow:0 4px 14px rgba(0,0,0,.08);cursor:pointer;transition:opacity .2s}
.ltag small{color:var(--muted);font-weight:500}.ltag.on{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0}.dot.warn{background:#D97706}.dot.bad{background:var(--bad)}
.live-hint{position:absolute;left:14px;bottom:8px;margin:0;font-size:11.5px;color:var(--muted);pointer-events:none}
.live-list{position:absolute;left:12px;top:12px;width:220px;max-height:calc(100% - 50px);overflow:auto;display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:6px}
.live-list button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;color:var(--ink);padding:8px;border-radius:10px;cursor:pointer;font:inherit}
.live-list button:hover,.live-list button.on{background:var(--sunk)}.live-list b{display:block;font-size:13px;font-weight:600}.live-list small{color:var(--muted);font-size:11.5px}
.live-panel{position:absolute;right:12px;top:12px;width:300px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.live-panel h3{margin:6px 0 2px;font-size:17px}.live-panel h4{margin:14px 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lp-h{display:flex;justify-content:space-between;align-items:center}.lp-x{border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer}
.lp-empty{color:var(--muted);font-size:13.5px;line-height:1.5}
.lp-bar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}.lp-bar i{display:block;height:100%;background:var(--brand);transition:width .6s}
.lp-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lp-g div{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:8px}.lp-g small{display:block;color:var(--muted);font-size:11px}.lp-g b{font-size:13.5px}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}
.lp-crew{display:flex;flex-wrap:wrap;gap:6px}.lp-crew span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:650;color:#fff;background:var(--brand)}.lp-crew span:nth-child(2n){background:var(--ink-2)}.lp-crew span:nth-child(3n){background:#1F7A47}
.lp-t{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.lp-a{display:flex;gap:8px;margin-top:14px}.lp-a .btn{flex:1;justify-content:center}
.live-ai{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.ai-h{display:flex;align-items:center;gap:10px}.ai-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--brand);color:#fff}.ai-ic svg{width:15px;height:15px}
.ai-m{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.ai-m button{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer}.ai-m button.on{border-color:var(--brand);color:var(--brand)}
#aibody{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.45}#aibody .me{color:var(--muted)}
.ai-f{display:flex;gap:8px;margin-top:12px}.ai-f input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}

function fmt(v,c,compact){

  return v.toLocaleString("fr-FR",{minimumFractionDigits:0,maximumFractionDigits:0})+" €";
}

   split=`<section class="card"><div class="ch"><h2>Répartition par entité</h2><span class="small muted">Refacturations interco exclues</span></div><div style="display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:14px"><i style="width:${fr.carnet/tot*100}%;background:var(--ink)"></i><i style="width:${ga.carnet/tot*100}%;background:var(--brand)"></i></div>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${[["FR","Bâtiments Moreau SAS",fr,"var(--ink)"],["GA","Moreau BTP Gabon SARL",ga,"var(--brand)"]].map(e=>`<button data-a="ent" data-e="${e[0]}" class="card" style="padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px"><span style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${e[3]}"></span><b>${entLbl(e[0])}</b><span class="small muted">${e[1]}</span></span><span class="small muted">Carnet</span><span class="num" style="font-size:20px;font-weight:600">${fmt(e[2].carnet,dispCur(),true)}</span><span class="small muted">${e[2].n} chantiers · pipeline ${fmt(e[2].pipe,dispCur(),true)}</span></button>`).join("")}</div></section>`}
  return `<div class="ph"><div><div class="eyb">Lundi 12 octobre · ${esc(scopeLbl())}</div><h1>Bonjour ${esc(t.user.n.split(" ")[0])}</h1></div><div class="acts"><button class="btn" data-a="go" data-v="deals">Voir le pipeline</button><button class="btn pri" data-a="newDeal">${ic("plus")}Nouvelle affaire</button></div></div>
  <section class="grid kpis" aria-label="Indicateurs">
   ${kp("Carnet de commandes",k.carnet,"Reste à produire sur les chantiers")}
   ${kp("Pipeline pondéré",k.weighted,`${k.open} affaires ouvertes`)}
   <div class="card kpi"><span class="l">Marge brute moyenne des devis</span><span class="v"><span data-count="${k.mg.toFixed(1)}" data-dec="1">0</span> %</span><span class="small" style="color:${k.mg<15?"var(--bad)":"var(--ok)"}">Seuil interne 15 %</span></div>
   ${kp("Encours clients",k.encours,k.echu?`<span style="color:var(--bad)">${fmt(k.echu,dispCur(),true)} échus à relancer</span>`:"Aucune facture échue")}
  </section>
  ${split}
  <div class="row">
   <section class="card" style="flex:2 1 520px"><div class="ch"><h2>Chiffre d’affaires facturé</h2><span class="small muted">2026 · ${dispCur()==="XAF"?"FCFA":"EUR"}</span></div>
    <div role="img" aria-label="Chiffre d’affaires mensuel" style="display:flex;align-items:flex-end;gap:8px;height:190px;border-bottom:1px solid var(--line)">${base.map((v,i)=>`<div style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px" title="${months[i]} : ${fmt(v,dispCur(),true)}">${i===9?`<span class="num small" style="white-space:nowrap">${fmt(v,dispCur(),true)}</span>`:""}<div class="grow" style="width:100%;height:${v/mx*100}%;border-radius:5px 5px 2px 2px;background:${i===9?"var(--brand)":"var(--sunk)"};${i<9?"border:1px solid var(--line)":""}"></div></div>`).join("")}</div>
    <div style="display:flex;gap:8px;margin-top:8px">${months.map(m=>`<span class="small muted" style="flex:1;text-align:center;font-size:10.5px">${m.slice(0,4)}</span>`).join("")}</div></section>
   <section class="card" style="flex:1 1 300px"><div class="ch"><h2>Aujourd’hui</h2>${on("planning")?`<button class="link" data-a="go" data-v="planning">Planning</button>`:""}</div>
    <div class="list">${ev.map(e=>`<div class="li"><span class="num small muted" style="width:44px">${hh(e[1])}</span><span class="dot" style="background:${srcColor(e[5])}"></span><span style="flex:1;min-width:0"><span class="t" style="display:block">${esc(e[3])}</span><span class="small muted">${esc(e[4])} · ${srcName(e[5])}</span></span>${isMulti()?`<span class="cc">${e[6]}</span>`:""}</div>`).join("")||`<p class="muted small">Aucun rendez-vous.</p>`}</div></section>
  </div>
  <div class="row">
   ${on("ia")?`<section class="card"><div class="ch"><h2>Assistant</h2><span class="pill ${risks.length?"warn":"ok"}">${risks.length} à risque</span></div>${risks.length?`<p class="small muted" style="margin:0 0 10px">${fmt(risks.reduce((a,x)=>a+toDisp(x.amount,x.cur),0),dispCur(),true)} pourraient glisser ce mois-ci.</p><div class="list">${risks.map(x=>`<button class="li" data-a="deal" data-id="${x.id}" style="width:100%;border:0;border-top:1px solid var(--line-2);background:none;text-align:left"><span style="flex:1"><span class="t" style="display:block">${esc(x.title)}</span><span class="small" style="color:var(--bad)">${esc(x.risk)}</span></span><span class="num small">${money(x.amount,x.cur,true)}</span></button>`).join("")}</div>`:`<p class="small" style="color:var(--ok)">Toutes les affaires sont à jour.</p>`}</section>`:""}
   <section class="card"><div class="ch"><h2>Chantiers en cours</h2><button class="link" data-a="go" data-v="chantiers">Tous les chantiers</button></div><div class="list">${V("chantiers").map(c=>`<button class="li" data-a="chantier" data-id="${c.id}" style="width:100%;border:0;border-top:1px solid var(--line-2);background:none;text-align:left;flex-wrap:wrap"><span style="flex:1 1 180px"><span class="t" style="display:block">${esc(c.name)} ${isMulti()?`<span class="cc">${c.cc}</span>`:""}</span><span class="small muted">${esc(c.city)} · ${esc(c.lead)}</span></span><span style="flex:1 1 140px;display:flex;align-items:center;gap:8px"><span class="bar" style="flex:1"><i style="width:${c.progress}%"></i></span><span class="num small">${c.progress} %</span></span><span class="pill ${c.tone}">${esc(c.status)}</span></button>`).join("")}</div></section>
  </div>`}
const kp=(l,v,sub)=>`<div class="card kpi"><span class="l">${l}</span><span class="v" data-money="${v}">${fmt(0,dispCur(),true)}</span><span class="small muted">${sub}</span></div>`;

  <div class="kan">${STAGES.map(s=>{const l=ds.filter(x=>x.stage===s.id);const tot=l.reduce((a,x)=>a+toDisp(x.amount,x.cur),0);return `<section class="col" data-drop="${s.id}" aria-label="${s.l}"><div class="colh"><span>${s.l} <span class="muted" style="font-weight:400">${l.length}</span></span><span class="num small muted">${fmt(tot,dispCur(),true)}</span></div>${l.map(x=>dealCard(x,s)).join("")}${l.length?"":`<div class="small muted" style="border:1px dashed var(--line);border-radius:10px;padding:24px 10px;text-align:center">Déposez une affaire ici</div>`}</section>`}).join("")}</div>

 return head+`<div class="dv"><div class="dv-main">

 ${q.lots.map((lo,li)=>`<section class="lot"><div class="loth"><h3><span class="num muted" style="margin-right:8px">${String(li+1).padStart(2,"0")}</span>${esc(lo.name)}${lo.src?` <span class="pill info" style="margin-left:6px">${esc(lo.src)}</span>`:""}</h3><span class="num" id="lt-${li}">${raw(lo.lines.reduce((a,l)=>a+lineTot(l),0),q.cur)}</span></div>
 <div class="tw"><table class="lt"><thead><tr><th style="padding-left:16px">Désignation</th><th class="hide-m">U</th><th class="r">Qté</th><th class="r hide-m">Déboursé</th><th class="r hide-m">Coef.</th><th class="r hide-m">PU vente</th><th class="r" style="padding-right:16px">Total HT</th></tr></thead><tbody>${lo.lines.map((l,i)=>`<tr><td style="padding-left:10px;min-width:200px"><input class="cell" value="${esc(l[0])}" data-a="cell" data-li="${li}" data-i="${i}" data-k="0" aria-label="Désignation"></td><td class="hide-m" style="width:60px"><input class="cell" value="${esc(l[1])}" data-a="cell" data-li="${li}" data-i="${i}" data-k="1" aria-label="Unité"></td><td class="qcol" style="width:100px"><input class="cell n" inputmode="decimal" value="${l[2]}" data-a="cell" data-li="${li}" data-i="${i}" data-k="2" aria-label="Quantité"></td><td class="hide-m" style="width:110px"><input class="cell n" inputmode="decimal" value="${l[3]}" data-a="cell" data-li="${li}" data-i="${i}" data-k="3" aria-label="Déboursé unitaire"></td><td class="hide-m" style="width:80px"><input class="cell n" inputmode="decimal" value="${l[4]}" data-a="cell" data-li="${li}" data-i="${i}" data-k="4" aria-label="Coefficient"></td><td class="r num small hide-m" style="width:110px" id="pu-${li}-${i}">${raw(l[3]*l[4],q.cur)}</td><td class="r num" style="width:130px;padding-right:16px;font-weight:500" id="lp-${li}-${i}">${raw(lineTot(l),q.cur)}</td></tr>`).join("")}</tbody></table></div>
 <div style="padding:8px 12px 12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm ghost" data-a="addLine" data-li="${li}">${ic("plus")}Ligne libre</button><button class="btn sm ghost" data-a="libPick" data-li="${li}">${ic("lib")}Bibliothèque de prix</button></div></section>`).join("")}

 </div><aside class="dv-side" aria-label="Synthèse"><div class="tot" id="dvtot">${totHtml(q,c)}</div>
